<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeSafe Connect</title>
<meta name="theme-color" content="#F1F6FA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== Theme tokens ===== */
  :root{
    color-scheme:light;
    --bg:#F1F6FA;--grid:rgba(15,70,90,.05);
    --blob1:rgba(45,212,191,.30);--blob2:rgba(56,189,248,.24);--blob3:rgba(167,139,250,.22);--blob4:rgba(244,114,182,.12);
    --surface:rgba(255,255,255,.78);--surface-2:rgba(255,255,255,.8);--surface-3:rgba(15,60,80,.06);--solid:#FFFFFF;
    --border:rgba(15,60,80,.10);--border-2:rgba(15,60,80,.18);
    --text:#0C2230;--text-2:#3D5566;--muted:#6A8191;
    --brand:#0D9488;--brand-2:#0284C7;--brand-3:#7C3AED;--gold:#A87B2F;
    --grad:linear-gradient(120deg,#0D9488 0%,#0284C7 55%,#6D28D9 100%);
    --grad-text:linear-gradient(100deg,#0F766E 0%,#0369A1 50%,#6D28D9 100%);
    --grad-soft:linear-gradient(135deg,rgba(13,148,136,.10),rgba(2,132,199,.08) 50%,rgba(124,58,237,.09));
    --on-grad:#FFFFFF;
    --umsg:linear-gradient(135deg,#0D9488,#0284C7 60%,#6D28D9);
    --danger:#DC2626;--danger-bg:#FFF1F2;--danger-bd:rgba(225,29,72,.28);--danger-solid:linear-gradient(135deg,#DC2626,#E11D48 60%,#F43F5E);
    --warn:#B45309;--warn-bg:#FFFBEB;--warn-bd:rgba(180,83,9,.22);
    --ok:#059669;
    --head-bg:rgba(255,255,255,.75);
    --shadow:0 24px 60px -26px rgba(12,40,60,.35);
    --shadow-sm:0 1px 2px rgba(12,40,60,.05),0 8px 24px -12px rgba(12,40,60,.2);
    --glow:0 0 0 1px rgba(13,148,136,.18),0 12px 30px -12px rgba(2,132,199,.5);
    --ease:cubic-bezier(.2,.8,.2,1);--head:'Prompt','IBM Plex Sans Thai',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;background:var(--bg)}
  body{font-family:'IBM Plex Sans Thai','Sarabun','Noto Sans Thai',sans-serif;color:var(--text);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  body{height:100vh;height:100dvh;overflow:hidden}
  button,input,textarea{font-family:inherit;color:inherit}
  ::selection{background:rgba(45,212,191,.3)}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .hidden{display:none !important}
  /* ซ่อนแถบเลื่อนทุกจุด (ยังปัดหรือหมุนล้อเมาส์เลื่อนได้ตามปกติ) */
  *{scrollbar-width:none;-ms-overflow-style:none}
  *::-webkit-scrollbar{display:none;width:0;height:0}

  /* aurora background */
  .aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .aurora i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(90px);animation:float 24s ease-in-out infinite alternate}
  .aurora i:nth-child(1){background:var(--blob1);top:-28vmax;left:-18vmax}
  .aurora i:nth-child(2){background:var(--blob2);top:-14vmax;right:-28vmax;animation-duration:30s;animation-delay:-8s}
  .aurora i:nth-child(3){background:var(--blob3);bottom:-34vmax;left:12vw;animation-duration:34s;animation-delay:-14s}
  .aurora i:nth-child(4){background:var(--blob4);bottom:-20vmax;right:-10vmax;width:40vmax;height:40vmax;animation-duration:26s}
  .aurora::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 75%)}

  /* ---------- SOS strip ---------- */
  .hotbar{flex:none;display:flex;overflow-x:auto;scrollbar-width:none;padding:7px 14px;font-size:12px;color:#fff;white-space:nowrap;background:linear-gradient(90deg,#BE123C,#E11D48 35%,#F43F5E 65%,#BE123C)}
  .hotbar::-webkit-scrollbar{display:none}
  .hotbar .in{display:flex;align-items:center;gap:8px;margin:0 auto}
  .hotbar .lb{display:inline-flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.3px}
  .hotbar .lb::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 2s infinite}
  .hotbar a{color:#fff;text-decoration:none;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:2px 11px;transition:background .2s}
  .hotbar a:hover{background:rgba(255,255,255,.32)}
  .hotbar a b{font-family:var(--head);font-weight:600;margin-right:5px}

  /* ---------- header ---------- */
  header{flex:none;position:sticky;top:0;z-index:50}
  header::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--head-bg);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);border-bottom:1px solid var(--border)}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--grad);opacity:.45}
  .hin{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:10px}
  .brand{display:flex;align-items:center;gap:11px;min-width:0;margin-right:auto}
  .brand>div{min-width:0}
  .brand .nm{font-family:var(--head);font-weight:600;font-size:18px;line-height:1.15;letter-spacing:.2px}
  .brand .nm span{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand .sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .orb{position:relative;flex:none;width:42px;height:42px;border-radius:50%;padding:2px;background:var(--grad)}
  .orb::after{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 60%,var(--brand) 80%,var(--brand-3) 90%,transparent);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));animation:spin 4s linear infinite}
  .orb img{display:block;width:100%;height:100%;border-radius:50%;background:#fff;padding:1px}
  .orb.xl{width:96px;height:96px;padding:4px;box-shadow:0 0 50px -8px rgba(13,148,136,.45),0 0 90px -24px rgba(124,58,237,.5)}
  .orb.xl::after{inset:-9px;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px))}
  .orb.xl img{padding:4px}
  .hbtns{display:flex;gap:6px;align-items:center}
  .hbtn{height:38px;display:inline-flex;align-items:center;gap:7px;padding:0 13px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .2s,border-color .2s,box-shadow .2s}
  .hbtn:hover{border-color:var(--border-2);background:#fff;box-shadow:var(--shadow-sm)}
  .hbtn.app{border-color:rgba(168,123,47,.35);background:linear-gradient(135deg,#FFF8EA,#FBEFD6)}
  .hbtn.lang{font-weight:700;letter-spacing:.5px;min-width:46px;justify-content:center}
  .exitbtn{flex:none;height:38px;display:inline-flex;align-items:center;gap:6px;padding:0 15px;border-radius:12px;background:var(--danger-solid);color:#fff;font-weight:700;font-size:13px;text-decoration:none;white-space:nowrap;box-shadow:0 8px 22px -8px rgba(225,29,72,.7);transition:transform .2s var(--ease)}
  .exitbtn:hover{transform:translateY(-1px)}
  @media(max-width:760px){
    .hotbar{padding:6px 10px;font-size:11.5px}
    .hin{padding:8px 10px;gap:5px}
    .brand{gap:7px}
    .brand .orb{width:34px;height:34px}
    .brand .nm{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .brand .sub{display:none}
    .hbtns{gap:4px}
    .hbtn{height:34px;width:32px;padding:0;justify-content:center;border-radius:10px;font-size:15px}
    .hbtn .t{display:none}
    .hbtn.lang{width:auto;min-width:0;padding:0 9px;font-size:12px}
    .exitbtn{height:34px;padding:0 11px;border-radius:10px;font-size:12.5px;gap:4px}
  }
  .aibar{flex:none;width:min(1140px,calc(100% - 40px));margin:12px auto 0;padding:8px 16px;border-radius:14px;background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn);font-size:12px;line-height:1.6;text-align:center}
  .aibar b{font-weight:700}
  body[data-step="3"] .aibar{display:none}
  @media(max-width:760px),(max-height:760px){.aibar .rest{display:none}}
  @media(max-width:760px){.aibar{width:calc(100% - 24px);margin-top:10px;padding:6px 12px;border-radius:12px;font-size:11.5px}}

  /* ---------- drawers (dropdown / bottom sheet) ---------- */
  .drawer{position:absolute;left:0;right:0;top:calc(100% + 10px);margin:0 auto;width:min(820px,calc(100% - 24px));max-height:min(72vh,600px);overflow:auto;padding:20px;border-radius:24px;background:var(--solid);border:1px solid var(--border-2);box-shadow:var(--shadow),var(--glow);animation:drop .28s var(--ease)}
  .drawer h4{font-family:var(--head);font-size:14.5px;font-weight:600;margin:0 2px 12px;background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent;width:max-content;max-width:100%}
  .drawer .row{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .resitem,.ngo,.learnitem{border:1px solid var(--border);background:#fff;border-radius:16px;transition:transform .2s var(--ease),border-color .2s,box-shadow .2s}
  .resitem{display:flex;align-items:center;gap:12px;padding:11px 14px;font-size:13px;color:var(--text-2);text-decoration:none}
  a.resitem:hover,.ngo:hover,.learnitem:hover{border-color:var(--border-2);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
  .resitem b{font-family:var(--head);font-weight:600;font-size:18px;min-width:56px;color:var(--danger)}
  .ngo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;font-size:13px;color:var(--text-2)}
  .ngo a{flex:none;color:var(--ok);font-weight:600;text-decoration:none;font-size:11.5px;border:1px solid currentColor;border-radius:999px;padding:3px 10px}
  .learnitem{display:flex;flex-direction:column;justify-content:space-between;gap:12px;padding:14px;font-size:13.5px;font-weight:600}
  .learnitem .top{display:flex;align-items:center;gap:10px}
  .learnitem .ic{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--grad-soft);border:1px solid var(--border)}
  .learnitem .acts{display:flex;gap:6px}
  .learnitem button,.learnitem a{flex:1;text-align:center;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none}
  .learnitem button{border:none;background:var(--grad);color:var(--on-grad)}
  .learnitem a{border:1px solid var(--border-2);background:#fff}
  @media(max-width:860px){.drawer{position:fixed;top:auto;left:10px;right:10px;width:auto;bottom:calc(88px + env(safe-area-inset-bottom));max-height:64vh;animation:sheet .3s var(--ease)}}

  /* ---------- main layout: ทุกหน้าพอดีหนึ่งจอ ไม่เลื่อนทั้งหน้า ---------- */
  main{flex:1;min-height:0;width:100%;max-width:1180px;margin:0 auto;padding:16px 20px 20px;display:flex;flex-direction:column}
  .card{position:relative;padding:34px;border-radius:30px;background:var(--surface);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--border);box-shadow:var(--shadow)}
  .card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(140deg,var(--brand),transparent 28%,transparent 72%,var(--brand-3));opacity:.45;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
  .anim{animation:rise .5s var(--ease)}
  .h2{font-family:var(--head);font-weight:600;font-size:clamp(20px,2.6vw,26px);line-height:1.35}
  .gt{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lead{color:var(--text-2);font-size:14.5px;line-height:1.8}
  .muted{color:var(--muted)}
  .subq{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.6}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;padding:5px 13px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.3px}
  .eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

  /* ---------- onboarding: แผงแบรนด์ซ้าย + การ์ดขั้นตอนขวา (สูงพอดีจอ) ---------- */
  .onb{flex:1;min-height:0;max-height:880px;margin:auto 0;display:grid;grid-template-columns:minmax(290px,360px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:20px}
  .intro{position:relative;display:flex;flex-direction:column;min-height:0;overflow:hidden;isolation:isolate;padding:28px 24px 20px;border-radius:30px;background:var(--grad);color:#fff;box-shadow:0 30px 60px -28px rgba(2,132,199,.65)}
  .intro::before,.intro::after{content:"";position:absolute;z-index:-1;border-radius:50%;background:rgba(255,255,255,.12)}
  .intro::before{width:280px;height:280px;right:-110px;top:-90px}
  .intro::after{width:200px;height:200px;left:-80px;bottom:-90px;background:rgba(255,255,255,.08)}
  .intro .top{margin-bottom:18px}
  .intro .orb,.mhero .orb{background:rgba(255,255,255,.45);box-shadow:0 18px 40px -14px rgba(0,0,0,.35)}
  .intro .orb::after{background:conic-gradient(from 0deg,transparent 0 60%,#fff 85%,transparent)}
  .intro .orb.xl{width:72px;height:72px;margin-bottom:16px}
  .intro .orb.xl::after{inset:-7px}
  .intro .eyebrow{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);margin-bottom:10px}
  .intro h1{font-family:var(--head);font-weight:600;font-size:clamp(21px,2.2vw,27px);line-height:1.3}
  .intro .tagline{margin-top:8px;font-size:14px;line-height:1.6;color:rgba(255,255,255,.9)}
  .vsteps{display:flex;flex-direction:column;gap:2px;margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.22)}
  .vs{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;border:none;background:none;color:rgba(255,255,255,.72);font-size:13.5px;text-align:left;transition:background .2s}
  button.vs{cursor:pointer}
  button.vs:hover{background:rgba(255,255,255,.1)}
  .vs i{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;border:1.5px solid rgba(255,255,255,.5)}
  .vs.on{background:rgba(255,255,255,.18);color:#fff;font-weight:600}
  .vs.on i{background:#fff;color:var(--brand-2);border-color:#fff}
  .vs.done i{background:rgba(255,255,255,.25);border-color:transparent;color:#fff}
  @media(max-height:780px){.intro .eyebrow,.intro .tagline{display:none}}
  .stage{min-width:0;min-height:0;display:flex;flex-direction:column;padding:24px 30px 20px}
  .kicker{flex:none;font-size:12.5px;font-weight:600;letter-spacing:.4px;color:var(--brand)}
  .pbar{flex:none;display:flex;gap:5px;margin:10px 0 16px}
  .pbar i{flex:1;height:4px;border-radius:4px;background:var(--border)}
  .pbar i.done{background:var(--grad)}
  .sbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 -8px;padding:2px 8px 8px;scrollbar-width:none}
  .stage .actions{flex:none;margin-top:14px}
  .mhero{display:none}
  @media(max-width:900px){
    main{padding:12px 12px 14px}
    .onb{grid-template-columns:1fr;max-height:880px;margin:auto 0}
    .intro,.dk{display:none}
    .stage{padding:18px 18px 16px;border-radius:24px}
    .pbar{margin:8px 0 12px}
    .mhero{display:flex;align-items:center;gap:14px;margin:2px 0 14px}
    .mhero .orb.xl{flex:none;width:56px;height:56px;padding:3px}
    .mhero .orb.xl::after{inset:-6px}
    .mhero h1{font-family:var(--head);font-size:19px;font-weight:600;line-height:1.3}
    .mhero p{font-size:12.5px;color:var(--text-2);margin-top:2px;line-height:1.5}
  }

  /* step content */
  .feats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
  .feat{padding:14px;border-radius:18px;background:#fff;border:1px solid var(--border)}
  .feat .i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:18px;margin-bottom:8px;background:var(--grad-soft);border:1px solid var(--border)}
  .feat b{display:block;font-size:13.5px;font-weight:600;line-height:1.45}
  .feat span{display:block;font-size:12px;color:var(--muted);line-height:1.5;margin-top:2px}
  @media(max-width:640px){.feats{gap:8px;margin:0 0 12px}.feat{padding:10px 6px;text-align:center}.feat .i{margin:0 auto 6px;width:34px;height:34px;font-size:17px}.feat b{font-size:12px;line-height:1.35}.feat span{display:none}}
  .moreb{display:none;margin-top:2px;padding:0;border:none;background:none;color:var(--brand-2);font-size:13px;font-weight:600;cursor:pointer}
  @media(max-width:900px),(max-height:820px){
    .about:not(.open){display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .moreb{display:inline-block}
  }
  .lineage{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:16px 0 0}
  .lineage span{border:1px solid var(--border);background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:500;color:var(--text-2)}
  .lineage span:last-child{background:var(--grad);border-color:transparent;color:#fff;font-weight:600}
  .lineage em{font-style:normal;color:var(--gold);font-weight:700}
  @media(max-width:640px){.lineage{gap:4px;margin-top:12px}.lineage span{font-size:11px;padding:4px 9px}}
  .safelist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .safeitem{position:relative;overflow:hidden;display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:16px;background:#fff;border:1px solid var(--border);font-size:13.5px;line-height:1.6;color:var(--text-2)}
  .safeitem::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--grad)}
  .anim .safeitem{animation:rise .5s var(--ease) both}
  .safeitem .ic{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:var(--grad-soft);border:1px solid var(--border)}
  @media(max-width:640px){.safeitem{font-size:13px;line-height:1.5;padding:9px 12px;gap:10px}.safeitem .ic{width:32px;height:32px;font-size:16px}}

  /* buttons */
  .btn{position:relative;overflow:hidden;min-height:52px;padding:10px 24px;border-radius:16px;border:none;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap;transition:transform .2s var(--ease),box-shadow .2s,opacity .2s}
  .btn:active{transform:scale(.98)}
  .btn.pri{background:var(--grad);color:var(--on-grad);box-shadow:var(--glow)}
  .btn.pri::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);transform:translateX(-100%);transition:transform .8s var(--ease)}
  .btn.pri:hover{transform:translateY(-1px)}
  .btn.pri:hover::after{transform:translateX(100%)}
  .btn.sec{background:#fff;border:1px solid var(--border-2)}
  .btn.sec:hover{box-shadow:var(--shadow-sm)}
  .btn.dng{background:var(--danger-solid);color:#fff;box-shadow:0 10px 26px -10px rgba(225,29,72,.7)}
  .btn:disabled{opacity:.4;box-shadow:none;cursor:not-allowed;filter:grayscale(.5);transform:none}
  .btn:disabled::after{display:none}
  .actions{display:flex;gap:10px;margin-top:28px}
  .actions .btn.sec{flex:1}.actions .btn.pri{flex:2}
  @media(max-width:640px){.btn{min-height:48px;font-size:14.5px}.stage .actions .btn.sec{flex:0 0 auto;padding:10px 18px}}
  .hint{margin-top:14px;text-align:center;font-size:13px;color:var(--gold)}

  /* personalize */
  .sec-t{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;margin:24px 0 12px;line-height:1.5}
  .sec-t.first{margin-top:4px}

  @keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  @keyframes sheet{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes float{to{transform:translate(8vmax,6vmax) scale(1.15)}}
  @keyframes blink{50%{opacity:.35}}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
  @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-5px);opacity:1}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
  /* =====================================================================
     AI Hologram layer — ใช้พาเลตเดิม (teal #0D9488 · sky #0284C7 · violet #7C3AED)
     ===================================================================== */
  @property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
  :root{
    --h1:#2DD4BF;--h2:#38BDF8;--h3:#A78BFA;
    --holo-line:rgba(2,132,199,.20);
    --hud:rgba(13,148,136,.55);
    --grad-flow:linear-gradient(90deg,#0F766E,#0369A1 33%,#6D28D9 66%,#0F766E);
    --grad-flow-b:linear-gradient(90deg,#0D9488,#0284C7 33%,#6D28D9 66%,#0D9488);
    --line-flow:linear-gradient(90deg,var(--h1),var(--h2) 33%,var(--h3) 66%,var(--h1));
    --neon:0 0 0 1px rgba(45,212,191,.35),0 0 18px -2px rgba(56,189,248,.45),0 0 40px -10px rgba(124,58,237,.45);
  }

  /* ---- ฉากหลัง: พื้นกริดโฮโลแกรม + ฝุ่นแสง + เส้นสแกน ---- */
  .holo{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .holo b{position:absolute;display:block}
  .holo .floor{left:-60%;right:-60%;bottom:0;height:60vh;background-image:linear-gradient(var(--holo-line) 1px,transparent 1px),linear-gradient(90deg,var(--holo-line) 1px,transparent 1px);background-size:60px 60px;transform:perspective(380px) rotateX(64deg);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(to top,#000 5%,transparent 80%);mask-image:linear-gradient(to top,#000 5%,transparent 80%);animation:hgrid 5s linear infinite}
  .holo .horizon{left:0;right:0;bottom:calc(60vh * .26);height:1px;background:linear-gradient(90deg,transparent,var(--h2) 30%,var(--h3) 70%,transparent);opacity:.5;box-shadow:0 0 18px 2px rgba(56,189,248,.35)}
  .holo .dust{inset:0;background-image:radial-gradient(circle,rgba(13,148,136,.55) 1px,transparent 1.7px),radial-gradient(circle,rgba(124,58,237,.42) 1px,transparent 1.7px),radial-gradient(circle,rgba(2,132,199,.5) 1.3px,transparent 2.2px);background-size:140px 140px,210px 210px,420px 420px;background-position:0 0,40px 70px,120px 30px;opacity:.75;animation:hdust 38s linear infinite}
  .holo .scan{left:0;right:0;top:0;height:22vh;background:linear-gradient(180deg,transparent,rgba(56,189,248,.06) 60%,rgba(45,212,191,.2) 98%,transparent);animation:hscan 10s linear infinite}

  /* ---- ข้อความไล่สีแบบไหล ---- */
  .gt,.brand .nm span,.drawer h4{background-image:var(--grad-flow);background-size:200% 100%;animation:hflow 7s linear infinite}
  .kicker::before{content:"";display:inline-block;width:6px;height:6px;margin-right:8px;border-radius:50%;background:currentColor;vertical-align:2px;box-shadow:0 0 0 3px rgba(13,148,136,.15),0 0 10px currentColor;animation:blink 1.6s infinite}

  /* ---- header: เส้นแสงวิ่ง ---- */
  header::after{height:2px;background:var(--line-flow);background-size:600px 100%;opacity:.9;box-shadow:0 0 12px rgba(56,189,248,.55);animation:hline 4s linear infinite}

  /* ---- orb: วงแหวนโคจรแบบโฮโลแกรม ---- */
  .orb::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px dashed rgba(2,132,199,.45);animation:spin 14s linear infinite reverse;pointer-events:none}
  .orb img{animation:hflick 7s infinite}
  .orb.xl{box-shadow:0 0 0 1px rgba(45,212,191,.35),0 0 50px -6px rgba(45,212,191,.55),0 0 90px -20px rgba(124,58,237,.6)}
  .orb.xl::before{inset:-20px;border:1.5px solid transparent;border-top-color:var(--h1);border-bottom-color:var(--h3);border-left-color:rgba(56,189,248,.55);border-right-color:rgba(56,189,248,.55);box-shadow:0 0 14px rgba(56,189,248,.45);animation:horbit 5s linear infinite}
  .intro .orb::before{border-color:rgba(255,255,255,.55)}
  .intro .orb.xl::before{border-top-color:#fff;border-bottom-color:rgba(255,255,255,.7);border-left-color:rgba(255,255,255,.35);border-right-color:rgba(255,255,255,.35);box-shadow:0 0 14px rgba(255,255,255,.5)}

  /* ---- การ์ดกระจกโฮโลแกรม: ขอบแสงหมุน + มุม HUD + เส้นสแกน ---- */
  .card::before,.chat::before{background:conic-gradient(from var(--ang),var(--h1),var(--h2) 15%,var(--h3) 30%,rgba(167,139,250,0) 45%,rgba(45,212,191,0) 70%,var(--h1));opacity:.85;animation:hang 7s linear infinite}
  .chat{position:relative}
  .chat::before{content:"";position:absolute;inset:0;z-index:2;border-radius:inherit;padding:1px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
  .card::after,.chat::after,.mbox::after{content:"";position:absolute;inset:12px;z-index:2;pointer-events:none;background:
    linear-gradient(var(--hud),var(--hud)) top left/18px 2px,linear-gradient(var(--hud),var(--hud)) top left/2px 18px,
    linear-gradient(var(--hud),var(--hud)) top right/18px 2px,linear-gradient(var(--hud),var(--hud)) top right/2px 18px,
    linear-gradient(var(--hud),var(--hud)) bottom left/18px 2px,linear-gradient(var(--hud),var(--hud)) bottom left/2px 18px,
    linear-gradient(var(--hud),var(--hud)) bottom right/18px 2px,linear-gradient(var(--hud),var(--hud)) bottom right/2px 18px;background-repeat:no-repeat;opacity:.8}
  .sp h5{display:flex;align-items:center;gap:8px}
  .sp h5::before{content:"";flex:none;width:14px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--h1),var(--h3));box-shadow:0 0 8px rgba(56,189,248,.8)}
  .mbox::before{background:var(--line-flow);background-size:600px 100%;animation:hline 4s linear infinite;box-shadow:0 0 14px rgba(56,189,248,.6)}

  /* ---- แผงแบรนด์ซ้าย: กริด + สแกนไลน์ ---- */
  .intro::before{inset:0;width:auto;height:auto;border-radius:0;background:linear-gradient(rgba(255,255,255,.11) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(255,255,255,.11) 1px,transparent 1px) 0 0/28px 28px;-webkit-mask-image:radial-gradient(ellipse 95% 70% at 70% 8%,#000 15%,transparent 75%);mask-image:radial-gradient(ellipse 95% 70% at 70% 8%,#000 15%,transparent 75%)}
  .intro::after{left:0;right:0;top:0;bottom:auto;width:auto;height:130px;border-radius:0;background:linear-gradient(180deg,transparent,rgba(255,255,255,.12) 80%,rgba(255,255,255,.4) 99%,transparent);animation:hscanin 7s linear infinite}

  /* ---- ลำแสงโปรเจกเตอร์ใต้ AI orb ในหน้าแชท ---- */
  .empty{position:relative}
  .empty .orb.xl{z-index:1;margin-bottom:46px}
  .empty::before{content:"";position:absolute;left:50%;top:44px;width:170px;height:90px;transform:translateX(-50%);background:linear-gradient(to top,rgba(56,189,248,.32),rgba(45,212,191,.1) 60%,transparent);clip-path:polygon(33% 100%,67% 100%,100% 0,0 0);animation:hflick 5s infinite;pointer-events:none}
  .empty::after{content:"";position:absolute;left:50%;top:126px;width:110px;height:16px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(56,189,248,.65),rgba(45,212,191,.25) 45%,transparent 70%);box-shadow:0 0 26px rgba(56,189,248,.4);pointer-events:none}
  @media(max-width:860px){.empty::before,.empty::after{display:none}}

  /* ---- ปุ่ม / แถบความคืบหน้า ---- */
  .btn.pri,.composer button,.chip.pri-on,.lineage span:last-child,.learnitem button{background-image:var(--grad-flow-b);background-size:200% 100%;animation:hflow 6s linear infinite}
  .btn.pri:hover:not(:disabled),.composer button:hover{box-shadow:var(--neon)}
  .pbar i{position:relative;overflow:hidden}
  .pbar i.done{background-image:var(--line-flow);background-size:600px 100%;animation:hline 3s linear infinite;box-shadow:0 0 10px rgba(56,189,248,.6)}

  /* ---- ประกายโฮโลแกรมเมื่อชี้ ---- */
  .rolebtn,.feat,.learnitem,.qp{position:relative;overflow:hidden}
  .rolebtn::after,.feat::after,.learnitem::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(56,189,248,.16) 47%,rgba(167,139,250,.16) 53%,transparent 65%);transform:translateX(-100%);transition:transform .9s var(--ease)}
  .rolebtn:hover::after,.feat:hover::after,.learnitem:hover::after{transform:translateX(100%)}
  .rolebtn.on{box-shadow:0 0 0 1px var(--ac),0 0 26px -6px var(--ac),0 14px 32px -16px var(--ac)}
  .chip.on,.mood.on{box-shadow:0 0 0 1px var(--brand),0 0 18px -6px var(--h2)}
  .bnav button.on{box-shadow:inset 0 0 0 1px var(--brand),0 0 16px -6px var(--h2)}

  /* ---- แชท ---- */
  .umsg{background-image:var(--grad-flow-b);background-size:200% 100%;box-shadow:0 0 0 1px rgba(45,212,191,.25),0 14px 28px -16px rgba(2,132,199,.8),0 0 24px -12px rgba(124,58,237,.6)}
  .abody{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(240,250,252,.9));border-color:rgba(2,132,199,.18);box-shadow:var(--shadow-sm),inset 0 1px 0 #fff}
  .abody::before{content:"";position:absolute;left:-1px;top:14px;bottom:14px;width:2px;border-radius:2px;background:linear-gradient(var(--h1),var(--h2),var(--h3));box-shadow:0 0 10px rgba(56,189,248,.7)}
  .amsg .av{animation:havp 3.2s ease-in-out infinite}
  .typing{background:linear-gradient(90deg,var(--muted) 40%,var(--brand-2) 50%,var(--muted) 60%) 0 0/300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hflow 2.4s linear infinite}
  .composer{position:relative}
  .composer::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--ang),var(--h1),var(--h2),var(--h3),transparent 40%,transparent 70%,var(--h1));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .3s;animation:hang 3s linear infinite;pointer-events:none}
  .composer:focus-within::before{opacity:1}

  /* ---- ไอคอนเส้น (SVG) แทนอีโมจิในเมนู ---- */
  .ico{display:block;flex:none;width:1em;height:1em}
  .hbtn .i{display:grid;place-items:center;font-size:16px}
  .hbtn.app{color:var(--gold)}.hbtn.app .t{color:var(--text)}
  .exitbtn .ico{width:15px;height:15px}
  .li{display:inline-grid;place-items:center;vertical-align:-2px;margin-right:6px;font-size:1.1em}
  .ic .ico,.feat .i .ico,.li .ico{stroke:url(#hg)}
  .rolebtn .ic .ico,.as-who .ic .ico{stroke:currentColor}
  .rolebtn .ic,.as-who .ic{color:var(--ac)}
  .sg.risk h4 .ic .ico{stroke:currentColor}
  .learnitem .ic,.feat .i,.safeitem .ic,.tl .ic,.sg h4 .ic,.rolebtn .ic,.as-who .ic{box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 0 14px -6px rgba(56,189,248,.7)}
  .sgtabs button .i,.bnav button .i{display:grid;place-items:center}
  .bnav button.on .ico{stroke:url(#hg)}
  .sbtn,.more{display:inline-flex;align-items:center;justify-content:center}
  .sbtn .li,.more .li{margin-right:5px}
  .modchip .ico,.deeplink .ico,.ragchip .ico,.qp .ico,.sugg .ico{display:inline-block;width:1.1em;height:1.1em;vertical-align:-3px;margin-right:3px}

  @keyframes hgrid{to{background-position:0 60px,0 0}}
  @keyframes hdust{to{background-position:0 -420px,40px -350px,120px -390px}}
  @keyframes hscan{from{transform:translateY(-22vh)}to{transform:translateY(122vh)}}
  @keyframes hscanin{from{transform:translateY(-140px)}to{transform:translateY(920px)}}
  @keyframes hflow{to{background-position:200% 0}}
  @keyframes hline{to{background-position:600px 0}}
  @keyframes hang{to{--ang:360deg}}
  @keyframes horbit{from{transform:rotateX(72deg) rotateZ(0)}to{transform:rotateX(72deg) rotateZ(360deg)}}
  @keyframes hflick{0%,100%{opacity:1}46%{opacity:1}47%{opacity:.72}48%{opacity:1}73%{opacity:.9}74%{opacity:1}}
  @keyframes havp{50%{box-shadow:0 0 0 2px var(--h2),0 0 16px 0 rgba(45,212,191,.7)}}
</style>
</head>

function retrieve(q){
 const ql=q.toLowerCase();
 let primary=null;
 for(const [phrase,mod] of INTENT){ if(ql.includes(phrase.toLowerCase())){primary=mod;break;} }
 const scored=KB.map(c=>({c,s:c.kw.reduce((n,k)=>n+(ql.includes(k.toLowerCase())?1:0),0)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.c);
 let out=[];
 if(primary){const pc=KB.find(c=>c.m===primary);if(pc)out.push(pc);}
 for(const c of scored){ if(!out.includes(c)) out.push(c); if(out.length>=3)break; }
 return out;
}

1) สะท้อนสิ่งที่ "เขาเพิ่งพูด" ด้วยคำพูดของคุณเอง ให้เขารู้ว่าคุณฟังจริงๆ (Listen)
2) ยอมรับความรู้สึกและบอกตรงๆ ว่าสิ่งที่เขารู้สึกนั้นสมเหตุสมผล และนี่ไม่ใช่ความผิดของเขา (Validate) — ชี้จุดแข็งหรือความกล้าหาญที่เขาแสดงออกมา
3) ค่อยให้ข้อมูล/ทางเลือก "เท่าที่จำเป็น" และทำให้เป็นทางเลือกของเขา ไม่ใช่คำสั่ง (Inquire + Enhance safety + Support)
4) ปิดด้วยคำถามปลายเปิดที่อ่อนโยน หนึ่งคำถาม ให้เขาเป็นคนนำบทสนทนาต่อ

=== ห้ามเด็ดขาด (สิ่งที่ทำให้คำตอบกลายเป็นใบปลิว) ===
- ห้ามขึ้นต้นด้วยการลิสต์ข้อมูล เช่น "สัญญาณได้แก่... 1 2 3" ทั้งที่เขายังไม่ได้ขอรายการ
- ห้ามยัดข้อเท็จจริงที่เขาไม่ได้ถาม ตอบเฉพาะสิ่งที่ตรงกับสิ่งที่เขาเล่า
- ห้ามพูดว่า "WeSafe แนะนำให้..." เป็นการบรรยายคู่มือ ให้พูดกับเขาตรงๆ เหมือนคนจริงที่ใส่ใจ
- GROUNDING FACTS ด้านล่างมีไว้เพื่อให้คุณตอบถูกต้อง (เบอร์โทร ข้อกฎหมาย ปัจจัยเสี่ยง) ห้ามคัดลอกมาเป็นย่อหน้า ให้ย่อยและพูดด้วยภาษาของคุณเองที่เชื่อมกับเรื่องของเขา

=== กฎเชิงเทคนิคและความปลอดภัย ===
A. เริ่มข้อความด้วย tag หนึ่งบรรทัด [MODULE:<ชื่อหมวด>] เลือกจาก: ${MODULE_LIST} — ถ้าอยู่นอกคู่มือใช้ [MODULE:นอกคู่มือ] (ผู้ใช้ไม่เห็น tag นี้ ระบบใช้แสดงป้ายและปุ่มลิงก์)
B. ห้ามแต่งสถิติ เบอร์โทร หรือข้อกฎหมายขึ้นเอง ใช้เฉพาะที่อยู่ใน GROUNDING FACTS หรือเบอร์ฉุกเฉินมาตรฐาน (191, 1300, 1323, 1669, 1387, OSCC)
C. ภาษาพูดธรรมชาติ อบอุ่น ย่อหน้าสั้น ห้ามใช้ markdown เครื่องหมาย * ** # หรือ bullet (เฉพาะบุคลากรสุขภาพ ใช้ 1. 2. ได้เมื่อ "สอนขั้นตอน" จริงๆ)
D. AI DISCLOSURE: คุณคือ AI หากถูกถามให้ยอมรับตรงๆ และถ้าผู้ใช้เริ่มผูกพันทางอารมณ์กับคุณ ให้อ่อนโยนชวนให้เขาเชื่อมต่อกับคนจริงหรือผู้ให้บริการด้วย
E. CONFIDENTIALITY: ห้ามสัญญาความลับ 100% ในบางกรณี เช่น มีเด็กเกี่ยวข้องหรืออันตรายถึงชีวิต ผู้ให้บริการบางวิชาชีพมีหน้าที่ตามกฎหมายต้องประสานหน่วยงาน ให้อธิบายตรงไปตรงมาเมื่อเรื่องนี้เกี่ยวข้อง
F. CHILD SAFETY: หากผู้ใช้อายุต่ำกว่า 18 ปี ใช้ภาษาที่อบอุ่นเหมาะกับวัย ย้ำว่าเขาไม่ผิด แนะนำให้บอกผู้ใหญ่ที่ไว้ใจ และสายเด็ก 1387 ห้ามให้เด็กจัดการสถานการณ์อันตรายลำพัง
G. ภาวะวิกฤต/คิดทำร้ายตัวเอง/อันตรายเฉพาะหน้า: ให้ความปลอดภัยมาก่อน บอกเบอร์ที่ติดต่อได้ทันที (191, 1300, 1323, 1669, 1387, OSCC) อย่างอบอุ่น แล้วจึงอยู่กับความรู้สึกของเขาต่อ
H. เมื่อเหมาะสม ชวนให้ใช้เครื่องมือประเมิน/วางแผนในแอป WeSafe (ระบบจะแสดงปุ่มลิงก์ให้อัตโนมัติ ไม่ต้องพิมพ์ลิงก์เอง)${rg}

function lbl(s){const m=s.match(/^(\p{Extended_Pictographic}\uFE0F?)\s*/u);return m?`<span class="li">${ico(m[1])}</span>${s.slice(m[0].length)}`:s;}
function splitIcon(s){const m=s.match(/^(\p{Extended_Pictographic}️?)\s*/u);return m?[ico(m[1]),s.slice(m[0].length)]:["•",s];}
function telItem(n,l,cls){return /^\d+$/.test(n)?`<a class="${cls}" href="tel:${n}"><b>${n}</b><span>${l}</span></a>`:`<div class="${cls}"><b>${n}</b><span>${l}</span></div>`;}
// ข้อความแจ้งว่าคุยกับ AI: ส่วนหัวตัวหนาแสดงเสมอ ส่วนที่เหลือซ่อนได้บนจอเล็ก

function grow(el){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,160)+"px";}
// เลื่อนแชทลงล่างสุด (หน้าแชทเลื่อนภายในกล่องแชท ส่วนหน้าอื่นเลื่อนทั้งหน้า)

function hotHTML(){const s=t().hot,k=s.indexOf(":");const items=s.slice(k+1).split("•").map(x=>x.trim()).filter(Boolean);

async function sendMsg(text){
 const inp=$("inp");const content=(text??(inp?inp.value:"")).trim();
 if(!content||S.loading)return;
 if(inp){inp.value="";grow(inp);}
 closeDrawers();

 if(CRISIS_W.some(w=>lc.includes(w.toLowerCase()))){S.crisis=true;const c=$("crisisCard");if(c){c.classList.remove("hidden");c.scrollIntoView({behavior:"smooth",block:"nearest"});}}
 if(MINOR_W.some(w=>lc.includes(w.toLowerCase()))){S.minor=true;const c=$("minorCard");if(c)c.classList.remove("hidden");}
 const q=$("quick");if(q)q.classList.add("hidden");

 const rag=retrieve(content);
 S.loading=true;
 const box=$("msgs");
 const ph=document.createElement("div");
 ph.innerHTML=`<div class="amsg"><img class="av" src="${LOGO}" alt=""><div class="acol"><div class="ahead"><span class="nm">WeSafe Connect</span><span class="ai">AI</span></div><div class="abody" id="streamBody"><span class="typing"><span class="dots"><i></i><i></i><i></i></span>${t().typing}</span></div></div></div>`;
 box.appendChild(ph);scrollChat();
 const payload={model:"claude-sonnet-4-5-20250929",max_tokens:600,system:buildSystem(rag),
  messages:S.msgs.map(m=>({role:m.role,content:m.content}))};
 let full="";
 try{ full=await getAIReply(payload); }catch(e){ full=""; }
 if(!full){ full=demoAnswer(content,rag); CONN_MODE=CONN_MODE||"demo"; }
 ph.remove();
 S.msgs.push({role:"assistant",content:full||("[MODULE:แหล่งช่วยเหลือ]\n"+t().err),rag:rag.map(c=>c.m),demo:CONN_MODE==="demo"});
 S.loading=false;renderMsgs();
}

// ---------------- AI connection helpers ----------------
async function streamRead(res){
 const reader=res.body.getReader();const dec=new TextDecoder();let buf="",acc="";
 while(true){
  const{done,value}=await reader.read();if(done)break;
  buf+=dec.decode(value,{stream:true});
  const lines=buf.split("\n");buf=lines.pop();
  for(const line of lines){
   if(!line.startsWith("data:"))continue;
   const d=line.slice(5).trim();if(d==="[DONE]")continue;
   try{const ev=JSON.parse(d);
    if(ev.type==="content_block_delta"&&ev.delta&&ev.delta.text){
     acc+=ev.delta.text;
     const el=document.getElementById("streamBody");
     if(el){const{body}=parseMod(acc);el.innerHTML=clean(esc(body||"…"));scrollChat();}
    }}catch(e){}
  }
 }
 return acc;
}
async function tryFetch(url,headers,payload,stream){
 const res=await fetch(url,{method:"POST",headers,body:JSON.stringify(stream?{...payload,stream:true}:payload)});
 if(!res.ok)throw new Error("HTTP "+res.status);
 const ct=res.headers.get("content-type")||"";
 if(stream&&res.body&&ct.includes("text/event-stream"))return await streamRead(res);
 const data=await res.json();
 return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
}
async function getAIReply(payload){
 const J={"Content-Type":"application/json"};
 if(PROXY_URL){try{const r=await tryFetch(PROXY_URL,J,payload,true);if(r){CONN_MODE="proxy";return r;}}catch(e){}}
 if(API_KEY){const H={...J,"x-api-key":API_KEY,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"};
  try{const r=await tryFetch("https://api.anthropic.com/v1/messages",H,payload,true);if(r){CONN_MODE="key";return r;}}catch(e){}
  try{const r=await tryFetch("https://api.anthropic.com/v1/messages",H,payload,false);if(r){CONN_MODE="key";return r;}}catch(e){}}
 if(CONN_MODE!=="demo"){
  try{const r=await tryFetch("https://api.anthropic.com/v1/messages",J,payload,true);if(r){CONN_MODE="artifact";return r;}}catch(e){}
  try{const r=await tryFetch("https://api.anthropic.com/v1/messages",J,payload,false);if(r){CONN_MODE="artifact";return r;}}catch(e){}
 }
 return "";
}

function demoAnswer(content,rag){
 const lc=content.toLowerCase();
 const crisis=CRISIS_W.some(w=>lc.includes(w.toLowerCase()));
 let mod,parts=[];
 if(crisis){
  mod="แหล่งช่วยเหลือ";
  parts.push(t().demoCrisis+" — โทร 191 (ตำรวจ), 1300 (พม. 24 ชม.), 1323 (สุขภาพจิต), 1669 (ฉุกเฉิน)"+(S.minor?", สายเด็ก 1387":"")+" หรือไปศูนย์พึ่งได้ (OSCC) โรงพยาบาลใกล้บ้านได้ทันที คุณไม่ได้อยู่คนเดียวนะคะ ตอนนี้คุณพออยู่ในที่ปลอดภัยไหม");
 }else if(rag.length){
  // คำตอบ demo ที่เขียนไว้ให้ "ตรงคำถาม" แบบ validate ก่อน แล้วปิดด้วยคำถามอ่อนโยนในตัวอยู่แล้ว
  const top=rag[0];
  mod=top.m;
  parts.push(top.demo||top.t);
 }else{
  mod="เกี่ยวกับ WeSafe";
  parts.push(KB[0].demo||KB[0].t);
 }
 return "[MODULE:"+mod+"]\n"+parts.join("\n\n");
}
// ---------------- key modal ----------------
function openKeyModal(){
 const M=$("postModal");M.classList.remove("hidden");
 M.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><div class="icon-hero" style="margin-bottom:4px">⚙️</div>
  <h3>${t().setT}</h3>
  <p class="mtext">${t().setB}</p>
  <input id="keyInp" class="field" type="password" placeholder="${t().setPh}" value="${API_KEY?"••••••••":""}">
  <div class="actions">
   <button class="btn sec" onclick="API_KEY='';CONN_MODE='demo';$('postModal').classList.add('hidden')">${t().setSkip}</button>
   <button class="btn pri" onclick="saveKey()">${t().setSave}</button></div></div>`;
}
function saveKey(){
 const v=document.getElementById("keyInp").value.trim();
 if(v&&!v.startsWith("•")){API_KEY=v;CONN_MODE=null;}
 $("postModal").classList.add("hidden");
}
// ---------------- post-chat mood ----------------
function openPost(){
 const M=$("postModal");M.classList.remove("hidden");S.postMood=null;
 M.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><div class="orb xl"><img src="${LOGO}" alt=""></div>
  <h3>${t().postT}</h3>
  <div class="moodrow">${MOODS.map((m,i)=>`<button class="mood" onclick="pickPost(${i+1})"><div class="e">${m[0]}</div><div class="l">${S.lang==="th"?m[1]:m[2]}</div></button>`).join("")}</div>
  <button class="btn sec" style="width:100%;margin-top:18px" onclick="$('postModal').classList.add('hidden')">${t().cont}</button></div>`;
}
function pickPost(v){
 S.postMood=v;const M=$("postModal");
 const better=S.preMood!=null&&v>S.preMood;
 M.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><div class="bigmood">${MOODS[v-1][0]}</div>
  ${S.preMood!=null?`<div class="moodtrend"><span>${MOODS[S.preMood-1][0]}</span><em>→</em><span>${MOODS[v-1][0]}</span></div>`:""}
  <p class="mtext" style="text-align:center;font-size:14.5px;margin-top:8px">${better?t().postB:t().postS}</p>
  <div class="actions">
   <button class="btn sec" onclick="$('postModal').classList.add('hidden')">${t().cont}</button>
   <a class="btn dng" href="https://www.google.com">${t().close}</a></div></div>`;
}
$("postModal").addEventListener("click",e=>{if(e.target.id==="postModal")e.target.classList.add("hidden");});

render();
</script>
